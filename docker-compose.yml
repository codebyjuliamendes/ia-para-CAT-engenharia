services:
  safecat:
    build: .
    image: safecat-ai:local
    ports:
      - "8502:8502"
    env_file:
      - path: .env
        required: false
    volumes:
      - safecat-data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  safecat-data:
