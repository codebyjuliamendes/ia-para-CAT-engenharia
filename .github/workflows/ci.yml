name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Instalar dependências (lockfile)
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest

  docker:
    name: Imagem Docker + smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: safecat-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health + migrações + raiz read-only)
        run: |
          docker run -d --name safecat -p 8502:8502 --read-only --tmpfs /tmp \
            -v safecat-data:/data safecat-ai:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8502/_stcore/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8502/_stcore/health
          docker exec safecat python -c "import sqlite3; c = sqlite3.connect('/data/safecat.db'); print(c.execute('select version_num from alembic_version').fetchone())"
          test "$(docker exec safecat id -u)" = "10001"
          test "$(docker inspect --format '{{.State.Health.Status}}' safecat)" != "unhealthy"
      - name: Logs do contêiner
        if: always()
        run: docker logs safecat || true
