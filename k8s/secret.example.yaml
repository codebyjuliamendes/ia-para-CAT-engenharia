# Exemplo apenas. Não aplique com valor real versionado; prefira
#   kubectl -n safecat create secret generic safecat-secrets --from-literal=ANTHROPIC_API_KEY=...
# ou um gerenciador de segredos (External Secrets, Sealed Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: safecat-secrets
  namespace: safecat
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "substitua-pela-chave"
